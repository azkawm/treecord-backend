[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# Deploy scripts write deployments/<chainId>.json. Scripts read them back.
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./out" }]

[fuzz]
runs = 512

[invariant]
runs = 128
depth = 100
fail_on_revert = false

[lint]
# Milestone windows, deadlines and replant timers are time-based by design. Validator drift of a few
# seconds is irrelevant at production time units (30 days), so this lint only adds noise.
exclude_lints = ["block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"

[rpc_endpoints]
anvil = "http://127.0.0.1:8545"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
